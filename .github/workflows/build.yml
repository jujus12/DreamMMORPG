name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK derle
        run: gradle :app:assembleDebug --stacktrace

      - name: APK'yi yeniden adlandir
        run: cp app/build/outputs/apk/debug/app-debug.apk DreamMMORPG.apk

      - name: Release olarak yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DreamMMORPG build ${{ github.run_number }}
          body: Telefona/tablete kurmak icin DreamMMORPG.apk dosyasini indir.
          files: DreamMMORPG.apk
