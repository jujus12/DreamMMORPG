name: Godot Prototype Release

on:
  workflow_dispatch:
  push:
    paths:
      - "GodotPrototype/**"
      - ".github/workflows/godot-prototype-release.yml"
    branches: [main, master]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest cmake;3.10.2.4988404 ndk;23.2.8568313"

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -o /tmp/godot_export_templates.tpz
          unzip -o /tmp/godot_export_templates.tpz -d /tmp/godot_export_templates
          cp -a /tmp/godot_export_templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate project import
        run: godot --headless --editor --path GodotPrototype --quit

      - name: Export Android APK
        run: |
          mkdir -p release
          godot --headless --path GodotPrototype --export-debug "Android" ../release/DreamMMORPG-Android.apk
          test -s release/DreamMMORPG-Android.apk
          file release/DreamMMORPG-Android.apk

      - name: Package source project
        run: |
          zip -r release/DreamMMORPG-GodotPrototype.zip GodotPrototype \
            -x "GodotPrototype/.godot/*" "*/.DS_Store"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DreamMMORPG-Android-build
          path: |
            release/DreamMMORPG-Android.apk
            release/DreamMMORPG-GodotPrototype.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-prototype-v0.1.${{ github.run_number }}
          name: DreamMMORPG Godot Prototype v0.1.${{ github.run_number }}
          body: |
            Early playable-prototype build.
            Includes the Android APK and the Godot source project.
            The APK is a prototype greybox build, not a complete MMORPG.
          files: |
            release/DreamMMORPG-Android.apk
            release/DreamMMORPG-GodotPrototype.zip
